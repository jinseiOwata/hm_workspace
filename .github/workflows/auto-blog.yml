name: auto-blog

on:
  schedule:
    # 毎朝 06:17 JST に1記事生成。GitHub の定期実行は遅延・取りこぼしが多いため、同じ朝に予備の実行を3回入れている。
    # 本日分の記事がすでにあれば generate_article.py は何もしないので、予備の実行で記事が二重にできることはない
    - cron: "17 21 * * *"   # 06:17 JST
    - cron: "47 22 * * *"   # 07:47 JST(予備)
    - cron: "17 0 * * *"    # 09:17 JST(予備)
    - cron: "47 2 * * *"    # 11:47 JST(予備)
  workflow_dispatch:
    inputs:
      force:
        description: "本日分が既にあっても追加生成する"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["auto_blog/**", ".github/workflows/auto-blog.yml"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto_blog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Generate article
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
          BLOG_FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          python generate_article.py
          git config user.name "auto-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts topics.txt
          git diff --cached --quiet || (git commit -m "auto-blog: add article $(date +%F)" && git push)

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: auto_blog/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 公開後に新着記事を告知: Bluesky へ自動投稿 + X 用の下書きを Issue にする
  announce:
    needs: deploy
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto_blog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # build ジョブが push した記事を含む最新の main を取る
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Announce new articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python social_post.py
          git config user.name "auto-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social_log.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "auto-blog: record announced articles $(date +%F)" && git pull --rebase && git push)
